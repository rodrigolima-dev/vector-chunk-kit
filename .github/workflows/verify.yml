name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: chunkkit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: chunkkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chunkkit -d chunkkit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv sync --locked --all-extras --python "3.11"
      - run: uv run pytest -q tests/test_postgres_integration.py
        env:
          CHUNKKIT_TEST_DATABASE_URL: postgresql://chunkkit:test-only-password@127.0.0.1:5432/chunkkit_test
