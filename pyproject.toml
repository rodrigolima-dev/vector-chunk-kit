[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vector-chunk-kit"
version = "0.1.0"
description = "Prepare reviewable text chunks and ingest them into a namespace-scoped pgvector store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ingest = ["openai>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.5,<1"]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.18,<2", "build>=1.3,<2"]

[project.scripts]
vector-chunk-kit = "vector_chunk_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_chunk_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vector_chunk_kit"]
